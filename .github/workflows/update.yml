name: Aggiorna programmazione

on:
  schedule:
    # Orari in UTC: 07:17 e 16:17 ora di Bologna d'estate (06:17 e 15:17 d'inverno)
    - cron: "17 5 * * *"
    - cron: "17 14 * * *"
    # Solo per la mail del giovedi': mercoledi' 23:17 UTC = giovedi' 01:17 d'estate, 00:17 d'inverno.
    # GitHub fa partire i cron con ore di ritardo (anche 5): cosi' la mail e' pronta
    # prima del task che la spedisce il giovedi' alle 10:45.
    - cron: "17 23 * * 3"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scraper/**"
      - "tests/**"
      - ".github/workflows/update.yml"

permissions:
  contents: write

concurrency:
  group: update-showtimes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Installa dipendenze
        run: pip install -r scraper/requirements.txt

      - name: Test del parser
        run: python -m unittest discover -s tests -v

      - name: Scarica orari da comingsoon.it
        run: python scraper/scrape.py --out data

      # Il giovedi' (e a ogni lancio manuale) prepara anche la mail della settimana,
      # cosi' chi la spedisce deve solo scaricare tre file di testo, senza eseguire codice.
      # Se fallisce non blocca il salvataggio degli orari: chi spedisce se ne accorge
      # perche' data/email/summary.json non riporta la settimana di oggi.
      - name: Prepara la mail del giovedi'
        continue-on-error: true
        run: |
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && [ "$(TZ=Europe/Rome date +%u)" != "4" ]; then
            echo "Oggi non e' giovedi', niente mail."
            exit 0
          fi
          python scraper/weekly_email.py --data data/showtimes.json --meta data/meta.json \
            --upcoming data/upcoming.json --out "$RUNNER_TEMP/email" > "$RUNNER_TEMP/summary.json"
          cp "$RUNNER_TEMP/summary.json" "$RUNNER_TEMP/email/"
          mkdir -p data/email
          cp "$RUNNER_TEMP"/email/* data/email/
          cat data/email/summary.json

      - name: Salva i dati se sono cambiati
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Nessuna novita' nella programmazione."
            exit 0
          fi
          git commit -m "dati: programmazione del $(TZ=Europe/Rome date +'%Y-%m-%d %H:%M')"
          git pull --rebase --quiet origin main
          git push
